name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  claude-auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Please review this pull request for:
            - Code quality and Python best practices
            - Potential bugs or issues
            - Test coverage
            - Type hint correctness

            Also flag these convention violations:
            - PR / issue / ticket-number references in source code (test names, assertion messages, comments) — those belong in commit messages and PR descriptions, not in code.
            - Multi-line inline `#` comment blocks. We cap inline comments at one line; the "why" belongs in the commit message.
            - Explanatory clauses or policy disclaimers in log / exception / error messages — keep them bare-fact.

            Don't flag (single-dev project; these get routinely denied):
            - Speculative-defensive concerns ("what if someone later passes None", "in case this is reused elsewhere", "for robustness against unexpected inputs", "future maintainers might not realize…") unless you name a SPECIFIC reachable execution path. The tell: "X could happen at line N because Y" (real) vs "someone might" (skip).
            - Defensive guards for conditions that cannot legitimately occur given how the code is reached. We trust internal invariants. Only flag boundary validation (user input, external APIs, network we don't own).

            Use inline comments for specific issues and a summary comment for overall feedback.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
